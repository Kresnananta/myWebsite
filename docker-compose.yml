services:
  db:
    image: mysql:8.0
    container_name: web_porto_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root","-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    
  # adminer -> alternatif phpmyadmin
  adminer:
    image: adminer
    container_name: porto_adminer
    restart: always
    ports:
      - "8080:8080"
  
  backend:
    build: ./backend
    container_name: web_porto_backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: .
    container_name: web_porto_frontend
    command: npm run dev -- --host --port 5173
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  db_data: