services:
  db:
    image: mysql:8.0
    container_name: web_porto_db
    restart: always
    environment:
      MYSQL_DATABASE: portfolio_db
      MYSQL_ROOT_PASSWORD: akusukabalon3478
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    
  # adminer -> alternatif phpmyadmin
  adminer:
    image: adminer
    container_name: porto_adminer
    restart: always
    ports:
      - "8080:8080"
  
  backend:
    build: ./backend
    container_name: web_porto_backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: akusukabalon3478
      DB_NAME: portfolio_db
    depends_on:
      - db

  frontend:
    build: .
    container_name: web_porto_frontend
    command: npm run dev -- --host --port 5173
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data: